name: Python CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m wardpulse all --output-dir reports_ci
      - name: Verify generated evaluation
        run: python -c "import json; from pathlib import Path; p=Path('reports_ci/metrics.json'); d=json.loads(p.read_text()); assert d['split']['test_examples'] > 0; assert Path('reports_ci/predictions.csv').exists()"
