name: Import WardPulse project
on:
  push:
    paths:
      - ".wardpulse_payload.b64"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore source files
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import io
          import tarfile
          from pathlib import Path
          bundle = Path(".wardpulse_payload.b64")
          data = base64.b64decode(bundle.read_text().strip())
          with tarfile.open(fileobj=io.BytesIO(data), mode="r:gz") as archive:
              archive.extractall(".", filter="data")
          PY
      - name: Install and test
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q
      - name: Reproduce example outputs
        run: python -m wardpulse all --output-dir reports
      - name: Publish complete source tree
        run: |
          rm .wardpulse_payload.b64
          rm .github/workflows/wardpulse-import.yml
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Publish WardPulse source, tests, documentation and reports"
          git push
